<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURION Tutoría Escolar | Hábitos, PNL y Mineduc</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #10151D;
            --card-bg: #18202C;
            --gold: #D4AF37;
            --gold-light: #F3E5AB;
            --text-light: #E2E8F0;
            --text-muted: #94A3B8;
            --accent-green: #25D366;
            --accent-blue: #0088cc;
            --soft-blue: #63B3ED;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        h1, h2, h3, h4 {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.5px;
        }

        header {
            background: linear-gradient(180deg, #1C2736 0%, var(--bg-dark) 100%);
            border-bottom: 2px solid var(--gold);
            padding: 60px 20px 45px;
            text-align: center;
        }

        .badge {
            background: linear-gradient(135deg, #D4AF37, #AA7C11);
            color: #10151D;
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 15px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--gold-light);
            margin-bottom: 15px;
            line-height: 1.3;
        }

        header p {
            font-size: 1.1rem;
            max-width: 800px;
            margin: 0 auto 25px;
            color: var(--text-muted);
        }

        .btn-header-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            padding: 35px 20px;
        }

        .hero-banner {
            background: linear-gradient(135deg, #1E293B 0%, #151D28 100%);
            border: 1.5px solid var(--gold);
            padding: 35px 25px;
            border-radius: 16px;
            margin-bottom: 35px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .hero-banner h2 {
            color: var(--gold-light);
            font-size: 1.8rem;
            margin-bottom: 12px;
        }

        .hero-banner p {
            font-size: 1.05rem;
            color: #CBD5E1;
            max-width: 820px;
            margin: 0 auto;
        }

        .habits-box {
            background: linear-gradient(145deg, #182230, #0f151e);
            border: 2px solid var(--gold);
            border-radius: 15px;
            padding: 40px 25px;
            margin: 40px 0;
        }

        .habits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .habit-item {
            background: rgba(26, 34, 45, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 22px;
            text-align: left;
        }

        .habit-item h4 {
            color: var(--gold-light);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 25px;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card h3 {
            color: var(--gold);
            margin-bottom: 12px;
            font-size: 1.25rem;
        }

        .comparison-box {
            background: linear-gradient(135deg, #1A2838 0%, #121820 100%);
            border: 1px solid var(--soft-blue);
            padding: 30px 25px;
            border-radius: 12px;
            margin: 35px 0;
            text-align: center;
        }

        .steps-box {
            background: var(--card-bg);
            border: 2px dashed var(--gold);
            padding: 40px 25px;
            border-radius: 15px;
            margin-top: 40px;
        }

        .steps-list {
            list-style: none;
            margin-top: 25px;
            text-align: left;
            max-width: 780px;
            margin-left: auto;
            margin-right: auto;
        }

        .steps-list li {
            padding: 16px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 1.05rem;
            display: flex;
            align-items: center;
        }

        .steps-list li:last-child {
            border-bottom: none;
        }

        .step-number {
            background: var(--gold);
            color: #121820;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        .pricing-section {
            margin-top: 50px;
            background: var(--card-bg);
            padding: 40px 20px;
            border-radius: 15px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .price-card {
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 25px 20px;
            text-align: center;
            background: #121820;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .price-card.featured {
            border: 2px solid var(--gold);
            background: #1E2836;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
        }

        .price-card h4 {
            font-size: 1.15rem;
            color: var(--gold-light);
            margin-bottom: 8px;
        }

        .price-tag {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 10px;
        }

        .btn {
            display: block;
            width: 100%;
            color: white;
            padding: 14px;
            text-align: center;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .btn-gold {
            background: linear-gradient(135deg, #D4AF37, #AA7C11);
            color: #121820 !important;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #25D366, #1EBE5D);
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .btn:hover {
            transform: scale(1.02);
        }

        footer {
            text-align: center;
            padding: 40px 20px 25px;
            background-color: #0A0D12;
            color: var(--text-muted);
            margin-top: 60px;
            font-size: 0.9rem;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }

        /* ============================================================== */
        /* WIDGET INTERACTIVO DE SOL-IA (CALIBRADO PARA CELULAR) */
        /* ============================================================== */
        #sol-widget-container {
            position: fixed;
            bottom: 20px;
            right: 15px;
            z-index: 9999999;
        }

        .sol-bubble-btn {
            background: rgba(18, 24, 34, 0.95);
            border: 2px solid var(--gold);
            border-radius: 50px;
            padding: 6px 14px 6px 6px;
            display: flex;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(212, 175, 55, 0.4);
            transition: transform 0.25s;
        }

        .sol-avatar-pulse {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            overflow: hidden;
            margin-right: 10px;
            flex-shrink: 0;
            position: relative;
        }

        .sol-avatar-pulse img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sol-online-dot {
            width: 10px;
            height: 10px;
            background: #25D366;
            border-radius: 50%;
            border: 2px solid #10151D;
            position: absolute;
            bottom: 2px;
            right: 2px;
        }

        .sol-bubble-text {
            text-align: left;
            line-height: 1.2;
        }

        .sol-bubble-title {
            color: var(--gold-light);
            font-size: 13px;
            font-weight: 700;
        }

        .sol-bubble-sub {
            color: #25D366;
            font-size: 11px;
            font-weight: 600;
        }

        /* VENTANA DE CHAT CENTRADA Y SIN CORTES */
        #sol-chat-window {
            display: none;
            position: fixed;
            bottom: 80px;
            right: 12px;
            left: 12px;
            max-width: 360px;
            margin-left: auto;
            height: 490px;
            max-height: calc(100vh - 100px);
            background: #141C26;
            border: 2px solid var(--gold);
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.7);
            flex-direction: column;
            overflow: hidden;
            z-index: 9999999;
        }

        .sol-chat-header {
            background: linear-gradient(135deg, #1C2736, #101620);
            border-bottom: 1.5px solid var(--gold);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sol-header-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sol-header-info img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1.5px solid var(--gold);
        }

        .sol-chat-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
        }

        .sol-chat-messages {
            flex: 1;
            padding: 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 0.9rem;
        }

        .msg-sol {
            background: #1B2636;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #E2E8F0;
            padding: 12px 14px;
            border-radius: 14px 14px 14px 2px;
            max-width: 90%;
            line-height: 1.5;
            align-self: flex-start;
            word-break: break-word;
        }

        .msg-user {
            background: linear-gradient(135deg, #D4AF37, #AA7C11);
            color: #10151D;
            padding: 10px 14px;
            border-radius: 14px 14px 2px 14px;
            max-width: 88%;
            font-weight: 600;
            line-height: 1.45;
            align-self: flex-end;
            word-break: break-word;
        }

        .sol-chat-input-box {
            padding: 10px;
            background: #101620;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sol-mic-btn {
            background: var(--gold);
            border: none;
            color: #10151D;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            cursor: pointer;
            font-size: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .sol-mic-btn.recording {
            background: #E53E3E;
            color: white;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); box-shadow: 0 0 12px #E53E3E; }
            100% { transform: scale(1); }
        }

        .sol-chat-input-box input {
            flex: 1;
            background: #182230;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 10px 14px;
            color: #FFF;
            font-size: 0.9rem;
            outline: none;
        }

        .sol-send-btn {
            background: linear-gradient(135deg, #D4AF37, #AA7C11);
            border: none;
            color: #10151D;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .voice-toggle-btn {
            background
